dotfiles:
  - src: gitconfig
    dest: .gitconfig
  - src: gitignore
    dest: .gitignore_global
  - src: tmux.conf
    dest: .tmux.conf
  - src: vimrc
    dest: .vimrc
  - src: zshrc
    dest: .zshrc

brew:
  - name: cmake
  - name: curl
  - name: gcc
  - name: git
  - name: jq
  - name: tmux
  - name: vim
  - name: watch
  - name: wget
  - name: zsh
  - name: zsh-syntax-highlighting

brewCask:
  - 1password
  - docker-desktop
  - dropbox
  - iterm2
  - spotify
  - steam
  - telegram
  - whatsapp
  - zen

